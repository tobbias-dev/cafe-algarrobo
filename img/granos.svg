  <!-- cerezas de café -->
  <g fill="#b23b2a">
    <circle cx="200" cy="200" r="13"/><circle cx="222" cy="206" r="12"/><circle cx="210" cy="222" r="11"/>
    <circle cx="336" cy="140" r="12"/><circle cx="356" cy="146" r="11"/>
  </g>
  <g fill="#e07a5a"><circle cx="196" cy="196" r="4"/><circle cx="332" cy="136" r="4"/></g>
