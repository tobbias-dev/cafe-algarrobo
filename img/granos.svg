<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-label="Ilustración de una rama de cafeto con frutos y granos de café">
  <rect width="480" height="320" rx="24" fill="#ead9c6"/>
  <!-- rama -->
  <path d="M30 250 C140 210 240 150 450 70" fill="none" stroke="#5a3d2e" stroke-width="8" stroke-linecap="round"/>
  <!-- hojas -->
  <g fill="#6b7f5a">
    <path d="M120 222 q-10 -60 40 -80 q10 50 -40 80 z"/>
    <path d="M150 214 q40 40 90 20 q-40 -40 -90 -20 z"/>
    <path d="M260 160 q-6 -60 46 -76 q6 52 -46 76 z"/>
    <path d="M290 150 q44 36 92 12 q-44 -36 -92 -12 z"/>
    <path d="M380 108 q0 -50 40 -64 q4 44 -40 64 z"/>
