  <g fill="#3d2a20">
    <ellipse cx="80" cy="290" rx="22" ry="15" transform="rotate(-20 80 290)"/>
    <ellipse cx="130" cy="296" rx="22" ry="15" transform="rotate(15 130 296)"/>
    <ellipse cx="380" cy="270" rx="22" ry="15" transform="rotate(-35 380 270)"/>
    <ellipse cx="426" cy="282" rx="22" ry="15" transform="rotate(10 426 282)"/>
  </g>
  <g fill="none" stroke="#ead9c6" stroke-width="3" stroke-linecap="round">
    <path d="M64 296 q16 -4 32 -12"/><path d="M114 290 q16 6 32 12"/>
    <path d="M364 280 q14 -10 32 -20"/><path d="M410 278 q16 2 32 8"/>
  </g>
</svg>
