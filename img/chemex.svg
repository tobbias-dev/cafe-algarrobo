  <path d="M130 84 q40 0 64 40" fill="none" stroke="#c0643a" stroke-width="7" stroke-linecap="round"/>
  <rect x="80" y="58" width="30" height="12" rx="4" fill="#c0643a"/>
  <!-- chorro de agua -->
